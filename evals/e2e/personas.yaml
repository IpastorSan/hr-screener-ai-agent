    phone: "+34612345601"
    email: lucia.fernandez@example.com
    has_license: true
    location_id: es-mad-centro
    availability: [part_time, weekends]
    schedule: [afternoon]
    experience_years: 2
    platforms: [glovo]
    start_date: "2026-10-26"
