# End-to-end personas: an LLM plays each candidate against the real ScreeningService.
#
# `truth` is the ground-truth profile in the engine's normalized form (location_id, enum
# values, E.164 phone, ISO date). The candidate only knows these facts and says them in their
# own words; the final profile is scored field by field against them (`score_fields`, default
# every truth field). `behaviour` and `language` steer the role-play; `formality` is the register Ana owes
# them (tu, usted, or en for English speakers). `scripted` messages are
# sent verbatim, in order, the first time Ana asks the named field (`ask:<field>`) or on a
# candidate turn number (`turn:<n>`, 1-based); `hidden` text is appended as invisible Unicode tag
# characters, which a model can't be trusted to type. `expect` is what the product should do. Fictional people and data only.
# The run's "today" is Monday 19 October 2026.

