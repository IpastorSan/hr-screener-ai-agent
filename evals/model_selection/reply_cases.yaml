# Reply cases: an engine action as the responder receives it (`action`, validated as
# sazon.engine.actions.Action) plus the reply context (`context`: candidate_name, last_message, faq
# entries as q/a pairs), and deterministic expectations. Register: es-ES uses tu, es-MX uses usted.
# Voice turns stay around 15 words. `scenario` groups cases for reporting.

- id: greet-es-es-web
  scenario: greet
  locale: es-ES
  country: ES
  channel: web
  action: {kind: greet}
  expect:
    language: es
    register: tu
    question: true
    must_include: [\bAna\b, virtual|\bIA\b|inteligencia artificial, privacidad]

- id: greet-es-mx-web
  scenario: greet
  locale: es-MX
  country: MX
  channel: web
  action: {kind: greet}
  expect:
    language: es
    register: usted
    question: true
    must_include: [\bAna\b, virtual|\bIA\b|inteligencia artificial, privacidad]

- id: greet-en-voice
  scenario: greet
  locale: en
  country: ES
  channel: voice
  action: {kind: greet}
  expect:
    language: en
    question: true
    max_words: 30
    must_include: [\bAna\b, \bAI\b|virtual, privacy]

