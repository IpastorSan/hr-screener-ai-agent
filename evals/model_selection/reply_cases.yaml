- id: faq-pay-es-es-web
  scenario: answer_faq
  locale: es-ES
  country: ES
  channel: web
  action:
    kind: answer_question
    question: ¿cuánto se cobra a la hora?
    follow_up: {kind: ask_field, field: availability}
  context:
    last_message: ¿cuánto se cobra a la hora?
    faq:
    - {q: '¿cuánto se cobra a la hora?', a: 'Repartidores en España: 9,80 € brutos por hora más propinas
        íntegras. Se cobra a fin de mes.'}
  expect:
    max_chars: 400
    language: es
    register: tu
    question: true
    must_include: ['9,80']
    must_not_include: ['\b(?:10|11|12)(?:[,.]\d+)? ?€', neto]

