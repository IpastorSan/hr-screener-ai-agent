- id: tch_onsite_with_the_head_of_studies
  description: In person, the interview is with the head of studies of the campus, whatever the
    subject, in the campus's afternoon hours.
  country: ES
  scheduling: {modes: [onsite]}
  steps:
    - {tap: 'yes', expect: {asks: full_name}}
    - {say: Carmen Vidal Soto, expect: {asks: phone}}
    - {tap: {country: ES, number: '612345680'}, expect: {asks: email}}
    - {say: carmen.vidal@example.com, expect: {asks: levels}}
    - {say: FP, expect: {asks: subjects}}
    - {say: Tecnología, expect: {asks: master_profesorado}}
    - {say: Sí, expect: {asks: certificado_delitos_sexuales}}
    - {say: Sí, expect: {asks: english_c1}}
    - {say: 'No', expect: {asks: campus}}
    - {say: Las Rozas, expect: {asks: workload}}
    - {say: Media jornada, expect: {asks: experience_years}}
    - {say: '12', expect: {asks: start_date}}
    - {say: ya, expect: {asks: confirm}}
    - {tap: 'yes', expect: {asks: slot, reply_matches: jefatura de estudios de la sede de Las Rozas}}
    - {tap: 'slot:1', expect: {booked: true, mode: onsite, interviewer: Andrés Collado}}
