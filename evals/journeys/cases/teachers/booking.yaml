# Teachers for Colegio Albéniz (`agents/teachers`): who interviews a qualified candidate. The
# interview owner depends on the subject as well as the campus. Format: evals/journeys/README.md.
- id: tch_maths_booked_with_the_head_of_maths
  description: A maths teacher for ESO and Bachillerato with the master and the certificate is
    booked by video with the head of maths, sciences and technology at the campus they chose.
  country: ES
  scheduling: {modes: [video]}
  steps:
    - {tap: 'yes', expect: {asks: full_name, register: tu, language: es}}
    - {say: Lucía Fernández Gil, expect: {asks: phone, ui: phone}}
    - {tap: {country: ES, number: '612345678'}, expect: {asks: email}}
    - {say: lucia.fernandez@example.com, expect: {asks: levels}}
    - {say: ESO y Bachillerato, expect: {asks: subjects}}
    - {say: Matemáticas, expect: {asks: master_profesorado}}
    - {say: Sí, expect: {asks: certificado_delitos_sexuales}}
    - {say: Sí, expect: {asks: english_c1}}
    - {say: Sí, expect: {asks: campus}}
    - {say: Pozuelo, expect: {asks: workload}}
    - {say: Jornada completa, expect: {asks: experience_years}}
    - {say: '6', expect: {asks: start_date}}
    - say: El 1 de diciembre
      offline_say: '2026-12-01'
      expect:
        asks: confirm
        ui: confirm
        card_matches: 'Etapas: ESO, Bachillerato; Materias: Matemáticas; Máster de Profesorado: Sí;
          Certificado de delitos sexuales: Sí; Inglés C1: Sí; Sede: Pozuelo; Jornada: Jornada completa'
    - {tap: 'yes', expect: {asks: slot, outcome: qualified, ui: slots}}
    - {tap: 'slot:1', expect: {booked: true, mode: video, interviewer: Elena Robles}}

