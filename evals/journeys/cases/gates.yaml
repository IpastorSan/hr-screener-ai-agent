# The two gates in Spain and Mexico: the driver's license and the city (the written chat, and a few
# calls typed as the speech to text writes them, `channel: voice`).
# Format: evals/journeys/README.md. Expected behaviour: docs/screening-rules.md (§1, §3).
# The clock starts on Monday 19 October 2026, 10:00 in Madrid. Fictional people and data only.
# Every journey stops shortly after its gate: what comes after is covered by other groups.

# --- license ---

- id: lic_es_yes_b_a2
  description: 'Spain. "Sí, B y A2" is a yes; the city comes next, then availability.'
  country: ES
  steps:
    - tap: "yes"
      expect: {asks: full_name}
    - say: Lucía Fernández Gil
      expect: {asks: phone}
    - tap: {country: ES, number: "612345701"}
      expect: {asks: email}
    - say: lucia.fernandez@example.com
      expect: {asks: has_license, register: tu, live: {reply_matches: "carnet", reply_not_matches: "licencia"}}
    - say: Sí, B y A2
      expect: {asks: city, action: ask_field, outcome: in_progress, register: tu}
    - say: Vivo en Lavapiés
      offline_say: Lavapiés
      expect: {asks: availability, outcome: in_progress}

- id: lic_mx_tipo_a
  description: 'Mexico. "Sí, licencia tipo A" is a yes; usted and "licencia", never "carnet".'
