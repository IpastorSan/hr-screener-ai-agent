# Booking journeys: interview mode, slots, booking, moving and cancelling, in Spain (tú) and
# Mexico (usted). Format: evals/journeys/README.md. The clock starts on Monday 19 October 2026,
# 10:00 in Madrid. Fictional people and data only. Every location offers both modes in the runner
# (a manager everywhere, video recruiters everywhere, fake calendar) unless a journey's
# `scheduling` limits the modes or fills the recruiters' calendars.

- id: bk_es_onsite_tap
  description: Spain, Madrid Centro posting. Both modes offered; taps in person; times inside 10-14/16-20
    on the interview grid; books the first; the confirmation names the manager of the local and the address,
    no Meet link.
  country: ES
  location: es-mad-centro
  steps:
  - tap: 'yes'
    expect:
      asks: full_name
      register: tu
  - say: Lucía Fernández Gil
    expect:
      asks: phone
  - tap:
      country: ES
      number: '612340001'
    expect:
      asks: email
  - say: lucia.bk1@example.com
    expect:
      asks: has_license
  - say: Sí, tengo el B
    offline_say: sí
    expect:
      asks: city
  - say: Vivo en Lavapiés
    offline_say: Lavapiés
    expect:
      asks: availability
  - say: Jornada completa
    offline_say: tiempo completo
    expect:
      asks: schedule
  - say: Por las mañanas
    offline_say: mañanas
    expect:
      asks: experience_years
  - say: 2 años
    offline_say: '2'
    expect:
      asks: platforms
  - say: Glovo
    expect:
      asks: start_date
  - say: El lunes que viene
    offline_say: '2026-10-26'
    expect:
      asks: confirm
  - tap: 'yes'
    expect:
      asks: mode
      outcome: qualified
      ui: quick_replies
      reply_matches: en persona.*videollamada|videollamada.*en persona
  - tap: onsite
    expect:
      asks: slot
      ui: slots
      mode: onsite
      register: tu
      reply_not_matches: \b(?!(?:1[0-3]|1[6-9]):(?:00|15|30|45)\b)\d{1,2}:\d{2}\b
      live:
        reply_matches: persona encargada del local de Madrid Centro
  - tap: slot:1
    expect:
      action: confirm_booking
      booked: true
      mode: onsite
      ui: booking
      outcome: qualified
      register: tu
      reply_matches: Fuencarral 112
      reply_not_matches: meet|https?://
      live:
        reply_matches: persona encargada del local de Madrid Centro
