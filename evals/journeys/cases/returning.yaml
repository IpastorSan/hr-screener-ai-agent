# --- qualified applications ---

- id: ret_saved_no_interview_new_times_es
  description: "Spain. None of two rounds of times suits, so the application is saved; two days later the same phone gets new times and books. Needs real models (offline can't say \"none\")."
  country: ES
  sessions:
    - steps:
        - tap: "yes"
        - say: Álvaro Prieto Ruiz
        - tap: {country: ES, number: "612345616"}
        - say: alvaro.prieto@example.com
        - say: Sí, tengo carnet
          offline_say: sí
        - say: Vivo en Lavapiés
          offline_say: Lavapiés
        - say: Tiempo completo
        - say: Por las mañanas
        - say: 2 años
          offline_say: "2"
        - say: Glovo
        - say: El lunes que viene
          offline_say: "2026-10-26"
        - tap: "yes"
          expect: {asks: mode}
        - tap: onsite
          expect: {asks: slot}
        - say: Ninguna de esas horas me va bien
          expect: {live: {asks: slot, action: offer_slots}}
        - say: Tampoco me va ninguna, lo siento
          expect: {live: {action: application_saved, outcome: qualified, booked: false, asks: none}}
    - after: 2d
      steps:
        - tap: "yes"
        - say: Álvaro Prieto Ruiz
        - tap: {country: ES, number: "612345616"}
          expect: {reply_matches: "continuar como Álvaro|continue as Álvaro", outcome: in_progress}
        - tap: "yes"
          expect:
            live:
              resumed: true
              asks: slot
              ui: slots
              register: tu
              reply_matches: "de nuevo"
        - tap: slot:1
          expect: {live: {action: confirm_booking, booked: true, outcome: qualified}}

