  description: "Mexico. Closed for no license; a week later the same phone and email apply again, get a fresh application and \"ya tengo la licencia\" carries on."
  country: MX
  sessions:
    - steps:
        - tap: "yes"
        - say: Ricardo Pineda Soto
        - tap: {country: MX, number: "5512345621"}
        - say: ricardo.pineda@example.com
        - say: No, no tengo licencia
          offline_say: "no"
          expect: {action: disqualify, outcome: disqualified, reason: no_license, closed: true}
    - after: 7d
      steps:
        - tap: "yes"
        - say: Ricardo Pineda Soto
        - tap: {country: MX, number: "5512345621"}
          expect: {asks: email, resumed: false, outcome: in_progress}
        - say: ricardo.pineda@example.com
