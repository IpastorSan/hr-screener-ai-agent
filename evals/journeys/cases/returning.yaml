- id: ret_booked_status_onsite_es
  description: "Spain. Booked in person; the next day the same phone is asked whether to carry on as Paula, with nothing of the booking; yes gets its status (day, time, location) and that it can be moved here, then moves the interview in that chat."
  country: ES
  sessions:
    - steps:
        - tap: "yes"
        - say: Paula Navarro Soler
        - tap: {country: ES, number: "612345617"}
        - say: paula.navarro@example.com
        - say: Sí, tengo carnet
          offline_say: sí
        - say: Vivo en Lavapiés
          offline_say: Lavapiés
        - say: Tiempo completo
        - say: Por las mañanas
        - say: 2 años
          offline_say: "2"
        - say: Uber Eats
        - say: El lunes que viene
          offline_say: "2026-10-26"
        - tap: "yes"
        - tap: onsite
        - tap: slot:1
          expect: {action: confirm_booking, booked: true, mode: onsite}
    - after: 1d
      steps:
        - tap: "yes"
        - say: Paula Navarro Soler
        - tap: {country: ES, number: "612345617"}
          expect:
            action: confirm_identity
            resumed: false
            ui: quick_replies
            reply_matches: "^Ya tenemos este teléfono registrado\\. ¿Quieres continuar como Paula\\?$"
        - tap: "yes"
          expect:
            action: application_status
            closed: false
            resumed: true
            register: tu
            ui: booking
            reply_matches: "entrevista reservada el (lunes|martes|miércoles|jueves|viernes) \\d{1,2}( de octubre)? a las \\d{2}:\\d{2} en el local de Madrid Centro.*escribe aquí y la cambiamos"
        - say: ¿La puedo cambiar a otro día?
          expect: {asks: slot, ui: slots, booked: true}
        - tap: slot:1
          expect: {action: confirm_booking, booked: true, mode: onsite, register: tu}

