# Returning candidates: several chat sessions that share a phone or an email. Format:
# evals/journeys/README.md. Rules: docs/screening-rules.md, "Duplicate application" and "Reopening a
# gate close". The clock starts on Monday 19 October 2026, 10:00 in Madrid. Fictional people only.
#
# The runner opens every session as a new chat on the journey's posting (a new tab, or a new
# posting of the same country); `restart: true` opens it through the previous chat's restart
# button instead, and `country:` through another country's posting. It has no
# abandonment timer: an application left mid-flow stays in progress, and the 30-day window is
# measured from its last activity.

# --- open applications: resumed at the pending question ---

- id: ret_resume_in_progress_es
  description: "Spain. Stops at the availability question; two hours later a new chat with the same phone resumes there, by name, and carries on."
  country: ES
  sessions:
    - steps:
        - tap: "yes"
          expect: {asks: full_name}
        - say: Lucía Fernández Gil
          expect: {asks: phone}
        - tap: {country: ES, number: "612345611"}
          expect: {asks: email, resumed: false}
        - say: lucia.fernandez@example.com
          expect: {asks: has_license}
        - say: Sí, tengo el B
          offline_say: sí
          expect: {asks: city}
        - say: Vivo en Lavapiés
          offline_say: Lavapiés
          expect: {asks: availability}
    - after: 2h
      steps:
        - tap: "yes"
          expect: {asks: full_name, resumed: false}
        - say: Lucía Fernández Gil
          expect: {asks: phone}
        - tap: {country: ES, number: "612345611"}
          expect: {reply_matches: "continuar como Lucía|continue as Lucía", outcome: in_progress}
        - tap: "yes"
          expect:
            resumed: true
            asks: availability
            outcome: in_progress
            register: tu
            reply_matches: "de nuevo, Lucía"
        - say: Tiempo parcial
          expect: {asks: schedule, resumed: true, outcome: in_progress}

