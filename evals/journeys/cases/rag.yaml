# Questions mid-flow that lean on earlier turns or ask several things (QA-BR). The extractor
# rewrites a follow-up to stand on its own and splits a multi-part question; each part is looked
# up on its own. Offline there is no retrieval: every question gets the unknown answer, so the
# sources and the wording are `live:` expectations.

- id: rag_followup_own_bike_es
  description: Spain. Asks whether a motorbike of their own is needed, then "y si uso la mía" about its requirements; tú throughout.
  country: ES
  steps:
    - tap: "yes"
      expect: {asks: full_name, register: tu}
    - say: ¿Necesito moto propia?
      expect:
        action: answer_question
        asks: full_name
        register: tu
        live: {faq_source: vehicle}
    - say: ¿Y si uso la mía, qué tiene que cumplir?
      expect:
        action: answer_question
        asks: full_name
        register: tu
        live: {faq_source: own-vehicle-es}
    - say: Lucía Fernández Gil
      expect: {asks: phone, register: tu}

- id: rag_followup_bike_bonus_mx
  description: Mexico. Asks whether a motorbike of their own is needed, then "¿y de cuánto es ese plus?" about the per-kilometre bonus; usted throughout.
  country: MX
  steps:
    - tap: "yes"
      expect: {asks: full_name, register: usted}
    - say: ¿Necesito moto propia?
      expect:
        action: answer_question
        asks: full_name
        register: usted
        live: {faq_source: vehicle, reply_matches: "kil[oó]metro"}
    - say: ¿Y de cuánto es ese plus?
      expect:
        action: answer_question
        asks: full_name
        register: usted
        live: {reply_matches: "2[.,]50"}
    - say: Jorge Ramírez Ortega
      expect: {asks: phone, register: usted}

- id: rag_multi_part_known_es
  description: Spain. Asks the pay and whether a helmet is given in one message; both are answered, with both sources.
  country: ES
  steps:
    - tap: "yes"
      expect: {asks: full_name, register: tu}
    - say: ¿Cuánto se paga y dais casco?
      expect:
        action: answer_question
        asks: full_name
        register: tu
        live:
          faq_source: [pay-es, helmet]
          reply_matches: casco
          reply_not_matches: no tengo informaci
    - say: Lucía Fernández Gil
      expect: {asks: phone, register: tu}

