- id: rag_other_country_es
  description: Spain. Asks the pay, then "¿Y en México?"; that question is answered from Mexico's documents and the answer says it is about Mexico; the chat stays Spanish (tú, Spain's documents).
  country: ES
  steps:
    - tap: "yes"
      expect: {asks: full_name, register: tu}
    - say: ¿Cuánto se paga?
      expect:
        action: answer_question
        asks: full_name
        register: tu
        live: {faq_source: pay-es, reply_matches: "€|euro"}
    - say: ¿Y en México?
      expect:
        action: answer_question
        asks: full_name
        register: tu
        live: {faq_source: pay-mx, reply_matches: "M[eé]xico", reply_not_matches: "€|euro"}
    - say: ¿Y dais casco?
      expect:
        action: answer_question
        asks: full_name
        register: tu
        live: {faq_source: helmet}
    - say: Lucía Fernández Gil
      expect: {asks: phone, register: tu}

- id: rag_other_country_mx
  description: Mexico. Asks the pay, then "¿Y en España?"; that question is answered from Spain's documents and says so; usted throughout.
  country: MX
  steps:
    - tap: "yes"
      expect: {asks: full_name, register: usted}
    - say: ¿Cuánto pagan?
      expect:
        action: answer_question
        asks: full_name
        register: usted
        live: {faq_source: pay-mx, reply_matches: "MXN|pesos|\\$"}
    - say: ¿Y en España cuánto se paga?
      expect:
        action: answer_question
        asks: full_name
        register: usted
        live: {faq_source: pay-es, reply_matches: "Espa[ñn]a", reply_not_matches: "MXN|pesos"}
    - say: Jorge Ramírez Ortega
      expect: {asks: phone, register: usted}
