# --- several answers in one message ---

- id: profile_es_several_fields_one_message
  description: >-
    Spain. The city answer also brings the availability; then one message brings the schedule,
    the years and the platform, and Ana skips to the start date.
  country: ES
  candidate:
    language: Spanish from Spain, casual and brief.
    truth:
      full_name: Lucas Romero Díaz
      phone: "+34612345622"
      email: lucas.romero@example.com
      has_license: true
      location_id: es-bcn-gracia
      availability: [weekends]
      schedule: [morning]
      experience_years: 3
      platforms: [glovo]
      start_date: "2026-10-26"
  steps:
    - tap: "yes"
      expect: {asks: full_name}
    - say: Lucas Romero Díaz
      expect: {asks: phone}
    - tap: {country: ES, number: "612345622"}
      expect: {asks: email}
    - say: lucas.romero@example.com
      expect: {asks: has_license}
    - say: Sí
      expect: {asks: city}
    - say: Vivo en Gràcia y solo puedo los findes
      offline_say: Gràcia
      expect: {live: {asks: schedule}}
    - persona: >-
        Repartidor de Barcelona con prisa. Cuando le preguntan el horario contesta de una vez
        todo lo que le queda: "por las mañanas, llevo 3 años con Glovo". Luego contesta corto.
      until: {asks: confirm}
      max_turns: 6
      expect: {asks: confirm, outcome: in_progress, register: tu}

