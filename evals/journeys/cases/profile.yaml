- id: profile_es_start_day_month_already_past
  description: >-
    Spain. "El 1 de octubre" with no year, on 19 October: the extractor rolls it to 1 October
    2027. Ana reads it back with today's date for context ("Hoy es 19 de octubre, ¿te refieres
    al 1 de octubre de 2027?"); a yes keeps it.
  country: ES
  steps:
    - tap: "yes"
      expect: {asks: full_name}
    - say: Raquel Soler Mena
      expect: {asks: phone}
    - tap: {country: ES, number: "612345628"}
      expect: {asks: email}
    - say: raquel.soler@example.com
      expect: {asks: has_license}
    - say: Sí, tengo el B
      offline_say: sí
      expect: {asks: city}
    - say: Lavapiés
      expect: {asks: availability}
    - say: Tiempo completo
      expect: {asks: schedule}
    - say: Tardes
      expect: {asks: experience_years}
    - say: Ninguna
      expect: {asks: start_date}
    - say: El 1 de octubre
      offline_say: "2027-10-01"  # what the extractor makes of it
      expect:
        action: confirm_value
        outcome: in_progress
        reply_matches: "hoy es .{0,12}19 de octubre"
    - say: Sí, eso
      offline_say: sí
      expect: {asks: confirm, outcome: in_progress}

