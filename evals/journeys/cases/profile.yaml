# Profile journeys: availability, schedule, experience, platforms, start date and the read-back,
# after both gates have passed. None of these fields disqualifies. Format: evals/journeys/README.md.
# The clock starts on Monday 19 October 2026, 10:00 in Madrid. Fictional people and data only.
#
# Offline the keyword extractor reads one field per message and nothing at the read-back except
# yes or no, so corrections typed at the summary are checked only with real models (`live:`).

# --- availability and schedule ---

- id: profile_es_availability_buttons_after_failures
  description: >-
    Spain. Two unusable answers to availability bring the buttons; a multi-select tap of part
    time and weekends is taken, and "flexible" alone settles the schedule.
  country: ES
  steps:
    - tap: "yes"
      expect: {asks: full_name}
    - say: Irene Castro Molina
      expect: {asks: phone}
    - tap: {country: ES, number: "612345611"}
      expect: {asks: email}
    - say: irene.castro@example.com
      expect: {asks: has_license}
    - say: Sí, tengo el B
      offline_say: sí
      expect: {asks: city}
    - say: Vivo en Lavapiés
      offline_say: Lavapiés
      expect: {asks: availability, ui: none}
    - say: Pues depende, ya veremos
      expect: {action: ask_field, asks: availability, ui: none, outcome: in_progress}
    - say: No sé qué decirte
      expect: {action: ask_field, asks: availability, ui: multi_select, outcome: in_progress}
    - tap: [part_time, weekends]
      expect: {asks: schedule, register: tu}
    - say: Flexible
      expect: {asks: experience_years}
    - say: Ninguna, nunca he repartido
      offline_say: ninguna
      expect: {asks: start_date}
    - say: Hoy mismo
      offline_say: hoy
      expect: {asks: confirm, ui: confirm, outcome: in_progress}

