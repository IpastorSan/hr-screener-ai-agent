# Cross-cutting journeys: questions mid-flow, the AI question, off-topic and small talk, Spanglish,
# register across a whole chat, frustration and abuse, prompt injection and the phrases that must
# not trip it. Format: evals/journeys/README.md. Fictional people and data only.
#
# Offline there is no retrieval and no model: a message ending in "?" is a question (answered
# with the unknown answer), nothing is read as abuse, frustration or off-topic, and the injection
# detector (deterministic) still fires. Expectations that need a model are under `live:`.

# --- Questions mid-flow, answered from the country's FAQ, then the pending question ---

- id: cc_faq_es_pay_insurance_documents
  description: Spain. Asks the pay while the license is pending, insurance while the city is, documents while the availability is; Spanish answers (euros, Seguridad Social, DNI/NIE), never the Mexican ones.
  country: ES
  steps:
    - tap: "yes"
      expect: {asks: full_name, register: tu}
    - say: Lucía Fernández Gil
      expect: {asks: phone}
    - tap: {country: ES, number: "612345611"}
      expect: {asks: email}
    - say: lucia.fernandez@example.com
      expect: {asks: has_license}
    - say: Antes de seguir, ¿cuánto se cobra por hora?
      expect:
        action: answer_question
        asks: has_license
        register: tu
        live:
          faq_source: pay-es
          reply_matches: "€|euro"
          reply_not_matches: "pesos|MXN|semana"
    - say: Sí, tengo el B
      offline_say: sí
      expect: {asks: city}
    - say: ¿Y si me caigo con la moto, estoy asegurado?
      expect:
        action: answer_question
        asks: city
        register: tu
        live:
          faq_source: insurance-es
          reply_matches: "Seguridad Social"
          reply_not_matches: "IMSS"
    - say: Vivo en Lavapiés
      offline_say: Lavapiés
      expect: {asks: availability}
    - say: ¿Qué papeles tengo que llevar a la entrevista?
      expect:
        action: answer_question
        asks: availability
        register: tu
        live:
          faq_source: documents-es
          reply_matches: "DNI|NIE"
          reply_not_matches: "\\b(INE|CURP|RFC)\\b"
    - say: Media jornada
      offline_say: tiempo parcial
      expect: {asks: schedule, register: tu}

