# --- Frustration and abuse ---

- id: cc_frustration_pause_es
  description: Spain. A frustrated reply gets a one-sentence question with buttons; a second gets the pause offer; taking it pauses without closing.
  country: ES
  steps:
    - tap: "yes"
      expect: {asks: full_name}
    - say: Nerea Gil Ibáñez
      expect: {asks: phone}
    - tap: {country: ES, number: "612345625"}
      expect: {asks: email}
    - say: Uf, ¿otra pregunta más? Esto es eterno
      expect:
        asks: email
        live:
          action: ask_field
          faq_source: none
          reply_not_matches: "[\\s\\S]{180,}"
    - say: nerea.gil@example.com
      expect: {asks: has_license}
    - say: Madre mía, ¿cuántas preguntas quedan? Esto es interminable
      expect:
        live:
          asks: has_license
          ui: quick_replies
          reply_not_matches: "[\\s\\S]{180,}"
    - say: Ya me cansé, son demasiadas preguntas
      expect:
        live:
          action: offer_pause
          asks: pause
          ui: quick_replies
          register: tu
    - tap: "yes"
      expect:
        live:
          action: end
          outcome: paused
          closed: false
          reply_matches: "vuelve|seguimos"

