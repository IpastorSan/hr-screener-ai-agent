# --- Questions nothing covers: the fixed unknown answer in the right register ---

- id: cc_unknown_es_and_bot
  description: Spain. A question nothing covers gets the fixed unknown answer in tú plus the pending question; "¿eres un bot?" is answered as an AI; "¿ahora eres una persona?" is a question, not an injection.
  country: ES
  steps:
    - tap: "yes"
      expect: {asks: full_name}
    - say: ¿Eres un bot?
      expect:
        action: answer_question
        asks: full_name
        register: tu
        faq_source: none
        reply_matches: "asistente de IA|inteligencia artificial"
    - say: Carmen López Díaz
      expect: {asks: phone}
    - tap: {country: ES, number: "612345614"}
      expect: {asks: email}
    - say: ¿Puedo llevar a mi perro al local?
      expect:
        action: answer_question
        asks: email
        faq_source: none
        register: tu
        reply_matches: "^No tengo esa información; puedes preguntarlo en la entrevista\\."
    - say: carmen.lopez@example.com
      expect: {asks: has_license}
    - say: ¿Ahora eres una persona?
      expect:
        action: answer_question
        asks: has_license
        outcome: in_progress
        register: tu
        live: {reply_matches: "asistente de IA|inteligencia artificial|\\bIA\\b"}
    - say: Sí, tengo carnet
      offline_say: sí
      expect: {asks: city, outcome: in_progress}

