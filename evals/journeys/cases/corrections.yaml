      expect: {asks: full_name}
    - say: Héctor Prado Ruiz
      expect: {asks: phone}
    - tap: {country: ES, number: "612345810"}
      expect: {asks: email}
    - say: hector.prado@example.com
      expect: {asks: has_license}
    - say: Sí
      expect: {asks: city}
    - say: Por ahí
      offline_say: por ahí
      expect: {asks: city}
    - say: Cerca de donde trabajo
      offline_say: cerca de donde trabajo
      expect: {asks: city}
    - say: Por ahí, ya te digo
