# Corrections: every field corrected by name, at every stage, in the chat and in voice-style
# calls (`channel: voice`: typed as speech to text writes it, no taps, no card). Format:
# evals/journeys/README.md. Rules: docs/screening-rules.md, "Corrections". The clock starts on
# Monday 19 October 2026, 10:00 in Madrid. Fictional people and data only.

# --- every field by name at the summary ---

- id: fix_every_field_es_web
  description: >-
    Spain, web. At the summary each field is named as wrong or to change, one after the other:
    each is asked again and the summary comes back with the new value; then a yes qualifies.
  country: ES
  steps:
    - tap: "yes"
      expect: {asks: full_name}
    - say: Nuria Campos Vidal
      expect: {asks: phone}
    - tap: {country: ES, number: "612345801"}
      expect: {asks: email}
    - say: nuria.campos@example.com
      expect: {asks: has_license}
    - say: Sí, el B
      offline_say: sí
      expect: {asks: city}
    - say: Vivo en Gràcia
      offline_say: Gràcia
      expect: {asks: availability}
    - say: Tiempo completo
      expect: {asks: schedule}
    - say: Mañanas
      expect: {asks: experience_years}
    - say: Ninguna
      expect: {asks: start_date}
    - say: El lunes que viene
      offline_say: "2026-10-26"
      expect: {asks: confirm, ui: confirm, card_matches: "Zona: Gràcia · local Barcelona Gràcia"}
    - say: Quiero cambiar el nombre
      expect: {asks: full_name, action: ask_field, faq_source: none}
    - say: Nuria Campos Ferrer
      expect: {asks: confirm, card_matches: "Nombre: Nuria Campos Ferrer"}
    - say: Mi móvil está mal
      expect: {asks: phone, ui: phone}
    - tap: {country: ES, number: "699111801"}
      expect: {asks: confirm, card_matches: "Teléfono: \\+34699111801"}
    - say: El correo está mal
      expect: {asks: email}
    - say: nuria.ferrer@example.com
      expect: {asks: confirm, card_matches: "Email: nuria.ferrer@example.com"}
    - say: Quiero cambiar lo del carnet
      expect: {asks: has_license}
    - say: Sí, tengo el B
      offline_say: sí
      expect: {asks: confirm, outcome: in_progress}
    - say: Quiero cambiar la zona
      expect: {asks: city}
    - say: Ahora vivo en Sants
      offline_say: Sants
      expect: {asks: confirm, card_matches: "Zona: Sants · local Barcelona Sants"}
    - say: La disponibilidad está mal
      expect: {asks: availability}
    - say: Fines de semana
      expect: {asks: confirm, card_matches: "Disponibilidad: Fines de semana"}
    - say: Quiero cambiar el horario
      expect: {asks: schedule}
    - say: Tardes
      expect: {asks: confirm, card_matches: "Horario: Tarde"}
    - say: La experiencia está mal
      expect: {asks: experience_years}
    - say: Tres años
      offline_say: "3"
      expect: {asks: platforms}
    - say: Glovo
      expect: {asks: confirm, card_matches: "Experiencia: 3 años"}
    - say: Quiero cambiar las plataformas
      expect: {asks: platforms}
    - say: Uber Eats
      expect: {asks: confirm, card_matches: "Plataformas: Uber Eats"}
    - say: La fecha de inicio está mal
      expect: {asks: start_date}
    - say: El miércoles 28
      offline_say: "2026-10-28"
      expect: {asks: confirm, card_matches: "Fecha de inicio: miércoles 28 de octubre"}
    - tap: "yes"
      expect: {outcome: qualified}

