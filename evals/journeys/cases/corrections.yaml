- id: fix_returning_es_web
  description: 'Spain, web. Stops at the summary; a new chat with the same phone resumes it after "¿Quieres continuar como Iris?", and "quiero cambiar el horario" asks it again before the summary.'
  country: ES
  sessions:
    - steps:
        - tap: "yes"
          expect: {asks: full_name}
        - say: Iris Pons Vela
          expect: {asks: phone}
        - tap: {country: ES, number: "612345813"}
          expect: {asks: email}
        - say: iris.pons@example.com
          expect: {asks: has_license}
        - say: Sí
          expect: {asks: city}
        - say: Gràcia
          expect: {asks: availability}
        - say: Tiempo completo
          expect: {asks: schedule}
        - say: Mañanas
          expect: {asks: experience_years}
        - say: Ninguna
          expect: {asks: start_date}
        - say: Hoy
          offline_say: hoy
          expect: {asks: confirm}
    - after: 3h
      steps:
        - tap: "yes"
