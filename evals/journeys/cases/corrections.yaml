# --- right after a gate close ---

- id: fix_after_license_close_mx_voice
  description: 'Mexico, a call. A no to the license, confirmed, closes; the very next message says they do have one, which reopens it and asks the city.'
  country: MX
  channel: voice
  steps:
    - say: Sí
      expect: {asks: full_name}
    - say: Gerardo Luna Paz
      expect: {asks: phone}
    - say: "5512345809"
      expect: {asks: email}
    - say: gerardo.luna@example.com
      expect: {asks: has_license}
    - say: "No"
      expect: {asks: has_license, action: confirm_value}
    - say: Así es, no tengo
      offline_say: sí
      expect: {action: disqualify, outcome: disqualified, reason: no_license}
    - say: Perdón, me equivoqué, sí tengo licencia
      offline_say: sí
      expect: {live: {asks: city, outcome: in_progress}}

- id: fix_after_unresolved_city_close_es_web
  description: 'Spain, web. Closed for a city never named; a place in the next message does not reopen it (an unresolved close is started again, never reopened).'
  country: ES
  steps:
