# --- after the interview is booked ---

- id: fix_after_booking_es_web
  description: >-
    Spain, web. With the interview booked: the email corrected keeps the interview (the
    invitation goes to the new one); the availability too; a new zone asks before moving, and a
    yes cancels the interview and offers times at the new location.
  country: ES
  scheduling: {modes: [onsite]}
  steps:
    - tap: "yes"
      expect: {asks: full_name}
    - say: Clara Bosch Mir
      expect: {asks: phone}
    - tap: {country: ES, number: "612345811"}
      expect: {asks: email}
    - say: clara.bosch@example.com
      expect: {asks: has_license}
    - say: Sí
      expect: {asks: city}
    - say: Gràcia
      expect: {asks: availability}
    - say: Tiempo completo
      expect: {asks: schedule}
    - say: Mañanas
      expect: {asks: experience_years}
    - say: Ninguna
      expect: {asks: start_date}
    - say: Hoy
      offline_say: hoy
      expect: {asks: confirm}
    - tap: "yes"
      expect: {asks: slot, outcome: qualified}
    - tap: slot:1
      expect: {booked: true, action: confirm_booking}
    - say: Mi correo está mal
      expect: {asks: email, booked: true}
    - say: clara.bosch.mir@example.com
      expect: {action: details_updated, booked: true, reply_matches: "actualizado tus datos"}
    - say: Quiero cambiar la disponibilidad
      expect: {asks: availability, booked: true}
    - say: Fines de semana
      expect: {action: details_updated, booked: true}
    - say: Quiero cambiar la zona
      expect: {asks: city, booked: true}
    - say: Ahora vivo en Sants
      offline_say: Sants
      expect: {asks: move, booked: true, reply_matches: "local de Barcelona Sants"}
    - tap: "yes"
      expect: {asks: slot, booked: false, outcome: qualified}
    - tap: slot:1
      expect: {booked: true, action: confirm_booking, reply_matches: "Barcelona Sants"}

