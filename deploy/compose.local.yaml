# The whole stack on localhost, plain HTTP through Caddy, images built from this checkout:
#   make stack-up     (http://localhost:8080)
#   make stack-down
services:
  api:
    image: sazon-api:local
    build: ../backend
    pull_policy: missing
    env_file: !override
      - path: local.env
        required: true
    volumes: !override
      - ${LOCAL_DATA_DIR:-./data-local}:/data

  web:
    image: sazon-web:local
    build: ../web
    pull_policy: missing

  caddy:
    image: sazon-caddy:local
    build: caddy
    pull_policy: missing
    ports: !override
      - "${LOCAL_HTTP_PORT:-8080}:80"
